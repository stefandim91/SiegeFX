name: PR title

# Squash merge is the only merge method and the squash commit takes its title
# from the PR title, so the PR title IS the commit subject that lands on main.
# Enforce Conventional Commits on it here instead of linting branch commits,
# which are squashed away. Upstream syncs are pushed straight to main (see
# CONTRIBUTING.md) and never pass through this check.
on:
  pull_request:
    # `edited` re-runs the check when only the title changes.
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Pinned to the v6.1.1 commit, not the movable tag.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The @commitlint/config-conventional type set.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Scope is optional and free-form: `feat: ...` and `fix(saves): ...` both pass.
          requireScope: false
          # Like commitlint's subject-case rule: the subject must not start
          # with an uppercase letter.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in the PR title "{title}" starts with an
            uppercase letter. Start it lowercase, e.g. "fix(saves): keep world on reload".
